<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cat vs. Laser</title>
    <meta
      name="description"
      content="A three-lane reflex game: help the cat catch the laser before it gets away."
    />

    <!--
      The link-preview card: public/card.png, 1200x630 --- replace it. The URL
      resolves against this page, like any link. No og:title/og:description:
      scrapers fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./" id="reset">Reset</a>
      </nav>
    </header>
    <main>
      <h1 class="sr-only">Cat vs. Laser</h1>
      <div id="game" data-status="ready" tabindex="0">
        <div class="lives" aria-hidden="true">
          <svg class="life" viewBox="0 0 24 24">
            <path
              d="M12 20.3 4.6 12.9a5 5 0 0 1 7.1-7.1l.3.3.3-.3a5 5 0 0 1 7.1 7.1z"
            />
          </svg>
          <svg class="life" viewBox="0 0 24 24">
            <path
              d="M12 20.3 4.6 12.9a5 5 0 0 1 7.1-7.1l.3.3.3-.3a5 5 0 0 1 7.1 7.1z"
            />
          </svg>
          <svg class="life" viewBox="0 0 24 24">
            <path
              d="M12 20.3 4.6 12.9a5 5 0 0 1 7.1-7.1l.3.3.3-.3a5 5 0 0 1 7.1 7.1z"
            />
          </svg>
        </div>
        <div class="lanes">
          <div class="lane" data-lane="0">
            <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 4 7 12 15 20" /></svg>
            <span class="cue"></span>
          </div>
          <div class="lane" data-lane="1">
            <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><polyline points="4 15 12 7 20 15" /></svg>
            <span class="cue"></span>
          </div>
          <div class="lane" data-lane="2">
            <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 4 17 12 9 20" /></svg>
            <span class="cue"></span>
          </div>
        </div>
        <div class="cat" aria-hidden="true">🐱</div>
        <div id="timer-bar" aria-hidden="true"><div></div></div>
        <p id="score" aria-hidden="true"></p>
        <button type="button" class="mode-timeattack">
          <span class="sr-only">Time attack mode</span>
          <svg class="hourglass" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 22h14" />
            <path d="M5 2h14" />
            <path d="M17 22v-4.17a2 2 0 0 0-.59-1.42L12 12l-4.41 4.41a2 2 0 0 0-.59 1.42V22" />
            <path d="M7 2v4.17a2 2 0 0 0 .59 1.42L12 12l4.41-4.41a2 2 0 0 0 .59-1.42V2" />
          </svg>
        </button>
      </div>
      <p id="outcome" role="status" aria-live="polite" class="sr-only"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
